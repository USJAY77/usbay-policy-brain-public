name: Governed Mail Synthetic Isolation Preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/mail-readiness-isolation.yml'
      - 'validation/mail_readiness/**'

permissions:
  contents: read

jobs:
  synthetic-isolation-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify result contract
        run: /usr/bin/python3 -B -m unittest discover -s validation/mail_readiness -p "test_*.py" -v
      - name: Run synthetic fresh-child controls only
        run: |
          /usr/bin/python3 -I -B validation/mail_readiness/isolation_preflight.py \
            --expected-head "$EXPECTED_HEAD" \
            --privileged-namespace-bootstrap \
            --output "$RUNNER_TEMP/usbay-isolation/preflight.json"
      - name: Hash bounded report
        if: always()
        run: |
          cd "$RUNNER_TEMP/usbay-isolation"
          sha256sum preflight.json > SHA256SUMS
      - name: Retain report and checksum for thirty days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usbay-isolation-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usbay-isolation/
          if-no-files-found: error
          retention-days: 30
